[project]
name = "database-course-project"
version = "0.1.0"
description = ""
authors = [
    {name = "TimurAgeenko",email = "ageenko.timur.10@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.0,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-coverage (>=0.0,<0.1)"
]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line-length = 119
